# Global Apache Security Hardening configuration
# This is loaded at the server config level.

# Suppress Apache version, OS, and module list from response headers.
ServerSignature Off
ServerTokens Prod

<IfModule mod_headers.c>
    # Prevent MIME-type sniffing (browsers must respect Content-Type header)
    Header always set X-Content-Type-Options "nosniff"

    # Prevent clickjacking: deny rendering in iframes from other origins.
    # For WordPress, SAMEORIGIN is required because the Customizer and Block Editor
    # load pages in iframes on the same domain.
    Header always set X-Frame-Options "SAMEORIGIN"

    # Control referrer information sent with navigation requests.
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    # Remove headers that expose versions
    Header always unset X-Powered-By
    Header always unset Server
</IfModule>

# ==============================================================================
# ACCESS RESTRICTIONS (FILES & DIRECTORIES)
# ==============================================================================

# Block access to hidden directories (.git, .svn, etc.),
# except for standard Let's Encrypt / ACME challenge directory (.well-known).
<DirectoryMatch "/\\.(?!well-known/)">
    Require all denied
</DirectoryMatch>

# Block access to hidden files (.env, .git, .gitignore, .htaccess, etc.),
# except for standard Let's Encrypt / ACME challenge files.
<FilesMatch "^\\.(?!well-known)">
    Require all denied
</FilesMatch>

# Block direct access to sensitive, backup, source, and configuration file extensions (case-insensitive).
<FilesMatch "(?i)(^#.*#|\\.(bak|conf|dist|fla|in[ci]|log|psd|sh|sql|sw[op]|ya?ml)|~)$">
    Require all denied
</FilesMatch>
